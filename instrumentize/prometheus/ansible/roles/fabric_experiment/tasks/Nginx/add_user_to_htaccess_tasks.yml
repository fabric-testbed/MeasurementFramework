---
# Add user to the htpasswd file
# Note this just adds/updates a user, it does not remove any existing users.
#
# Uses the real `htpasswd` binary (apache2-utils/httpd-tools, installed in
# fabric_experiment_install_tasks.yml) rather than Ansible's `htpasswd`
# module -- see that file for why: the module depends on the unmaintained
# `passlib` library, pinned against an old `bcrypt` to work around a
# passlib/bcrypt compatibility bug, which breaks under PEP 668.

- name: Ensure htpasswd file exists
  ansible.builtin.file:
    path: "{{ base_install_dir }}/nginx/config/htpasswd"
    state: touch
    access_time: preserve
    modification_time: preserve
    mode: '0644'
  become: true

# Password piped via stdin (-i) so it never shows up in `ps`; no_log on the
# whole task since the rendered command isn't auto-redacted the way the old
# module's password param was. Always reports "changed" -- htpasswd gives no
# idempotency signal to key off of, unlike the module it replaces.
- name: Add user to htpasswd file
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      printf '%s' "{{ fabric_prometheus_ht_password }}" | htpasswd -i -B "{{ base_install_dir }}/nginx/config/htpasswd" "{{ fabric_prometheus_ht_user }}"
    executable: /bin/bash
  become: true
  no_log: true
