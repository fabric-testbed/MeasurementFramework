---
- name: Add Node Exporters
  block:
  # This installs the needed self signed certs for the node_exporter.
  # Note user and group is also done in cloudalchemy.node-exporter used later, 
  #   but we need it here for the cert creation.
  - name: Add node-exp group.
    group:
      name: node-exp
      state: present
      system: true
  
  - name: Add node-exp user.
    user:
      name: node-exp
      groups: node-exp
      append: true
      shell: /usr/sbin/nologin
      system: true
      create_home: false
      home: /

  - name: Create node_exporter cert dir
    file:
      path: "/etc/node_exporter"
      state: directory
      owner: root
      group: root

  # The openssl_privatekey/openssl_csr/openssl_certificate tasks below need
  # cryptography>=3.3 present on *this* (target) node's Python -- not just
  # the controller's -- since that's where these modules actually run.
  # https://docs.ansible.com/ansible/latest/collections/community/crypto/openssl_csr_module.html
  - name: Check for PEP 668 externally-managed-environment marker
    ansible.builtin.shell: find /usr/lib/python3*/EXTERNALLY-MANAGED /usr/lib64/python3*/EXTERNALLY-MANAGED 2>/dev/null
    register: externally_managed_marker
    changed_when: false
    failed_when: false

  - name: Ensure python cryptography dependency is installed
    ansible.builtin.pip:
      name: "cryptography>=3.3"
      executable: pip3
      state: present
      extra_args: "{{ '--break-system-packages' if externally_managed_marker.stdout else omit }}"

  - name: create key    
    openssl_privatekey:
      path: /etc/node_exporter/tls.key
      size: 2048
      owner: node-exp
      group: node-exp

  - name: create csr
    openssl_csr:
      common_name: '{{ hostname }}'
      path: /etc/node_exporter/tls.csr
      privatekey_path: /etc/node_exporter/tls.key
      owner: node-exp
      group: node-exp

  - name: create cert
    openssl_certificate:
      path: /etc/node_exporter/tls.cert
      csr_path: /etc/node_exporter/tls.csr
      privatekey_path: /etc/node_exporter/tls.key
      provider: selfsigned
      owner: node-exp
      group: node-exp

  become: yes