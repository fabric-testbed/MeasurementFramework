---
# Ansible Galaxy Roles Requirements
# Must be installed using 
#   ansible-galaxy install -r requirements.yml
# and 
#   ansible-galaxy collection install -r requirements.yml


roles:
# Ensures pip is installed
  - name: geerlingguy.pip
  # #version: 

# Python Docker SDK to allow docker control from ansible.
  - name: geerlingguy.docker
  #version:

# For Node Exporters
  # cloudalchemy.node_exporter is deprecated/unmaintained; prometheus.prometheus
  # (prometheus-community/ansible) is its actively maintained successor and
  # uses the same variable names (node_exporter_web_listen_address,
  # node_exporter_tls_server_config, node_exporter_basic_auth_users, etc).
  - name: prometheus.prometheus
  #version:

collections:
  - name: community.docker


